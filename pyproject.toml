[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
exclude = ["^windows/", "^tests/"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "openai", "numpy.*", "dotenv"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B018"]
"tests/simple.py" = ["E402"]
